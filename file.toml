# Lines that start with # are comments, and PackSquash ignores them.
# You can also start a comment in the middle of a line with #, that
# spans until the end of the line

# Global options
pack_directory = 'C:\path\to\pack'
output_file_path = 'C:\path\to\output.zip'
recompress_compressed_files = false
zip_compression_iterations = 2
automatic_minecraft_quirks_detection = true
automatic_asset_types_mask_detection = false
# The value of this option is ignored due to automatic quirk detection
# being enabled, but this usually does not matter
work_around_minecraft_quirks = ['grayscale_images_gamma_miscorrection', 'java8_zip_parsing']
allow_mods = ['OptiFine']
skip_pack_icon = false
validate_pack_metadata_file = true
ignore_system_and_hidden_files = true
zip_spec_conformance_level = 'disregard'
# These two take effect ONLY because the conformance level above is 'disregard'
size_increasing_zip_obfuscation = true
percentage_of_zip_structures_tuned_for_obfuscation_discretion = 100
never_store_squash_times = true
# System dependent values. Use them as-is only if you have a good reason,
# not just because you have copied and pasted this options file
threads = 4
spooling_buffers_size = 128 # MiB

# Per-file options below

# Ogg files do not get transcoded, and obfuscation is off for playback compatibility.
['**/*?.ogg']
transcode_ogg = false
two_pass_vorbis_optimization_and_validation = false
ogg_obfuscation = false

# Optional audio transcoding (lossy; disabled in the UI configuration)
['**/*?.{flac,wav}']
channels = 2
sampling_frequency = 44100
target_pitch = 1.0
target_bitrate_control_metric = 96000

# JSON files with comments get prettified and nothing is removed from them
['**/*.jsonc']
minify_json = false
delete_bloat_keys = false

# Plain JSON: minify while keeping attribution and other keys.
['**/*.json']
minify_json = true
delete_bloat_keys = false

# Preserve visible colors; PNG obfuscation is version-dependent
['**/*.png']
image_data_compression_iterations = 0
color_quantization_target = 'none'
maximum_width_and_height = 4096
skip_alpha_optimizations = true
downsize_if_single_color = false
png_obfuscation = true

# Don't minify shaders
['**/*.{fsh,vsh}']
shader_source_transformation_strategy = 'keep_as_is'

# Preserve known companion files
['**/*.properties']
force_include = true
['**/*.rpo']
force_include = true